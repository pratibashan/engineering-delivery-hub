AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Engineering Delivery Hub backend

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        PROJECTS_TABLE_NAME: engineering-delivery-projects

Resources:
  ProjectsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Engineering Delivery Hub API
          version: "1.0"
        paths: {}

      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:3000"
        AllowHeaders:
          - "Content-Type"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  GetProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/getProjects.handler

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: arn:aws:dynamodb:us-east-2:867719008416:table/engineering-delivery-projects

      Events:
        GetProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProjectsHttpApi
            Path: /projects
            Method: GET

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/getProjects.ts
        Minify: false
        Target: es2022
        Sourcemap: true

  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/createProject.handler

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: arn:aws:dynamodb:us-east-2:867719008416:table/engineering-delivery-projects

      Events:
        CreateProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProjectsHttpApi
            Path: /projects
            Method: POST

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/createProject.ts
        Minify: false
        Target: es2022
        Sourcemap: true

  GetProjectByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/getProjectById.handler

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: arn:aws:dynamodb:us-east-2:867719008416:table/engineering-delivery-projects

      Events:
        GetProjectById:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProjectsHttpApi
            Path: /projects/{id}
            Method: GET

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/getProjectById.ts
        Minify: false
        Target: es2022
        Sourcemap: true

  UpdateProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/updateProject.handler

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: arn:aws:dynamodb:us-east-2:867719008416:table/engineering-delivery-projects

      Events:
        UpdateProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProjectsHttpApi
            Path: /projects/{id}
            Method: PUT

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/updateProject.ts
        Minify: false
        Target: es2022
        Sourcemap: true

  DeleteProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/deleteProject.handler

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: arn:aws:dynamodb:us-east-2:867719008416:table/engineering-delivery-projects

      Events:
        DeleteProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProjectsHttpApi
            Path: /projects/{id}
            Method: DELETE

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/deleteProject.ts
        Minify: false
        Target: es2022
        Sourcemap: true

Outputs:
  ProjectsApiUrl:
    Description: Base URL for the projects API
    Value: !Sub "https://${ProjectsHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"

  GetProjectsApiUrl:
    Description: URL for GET /projects
    Value: !Sub "https://${ProjectsHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/projects"
